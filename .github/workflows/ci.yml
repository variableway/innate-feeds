name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install all dependencies
        run: bun run install:all

      - name: Run tests
        run: bun run test

      - name: Type check backend
        run: cd backend && bun run typecheck

      - name: Type check frontend
        run: cd frontend && bun run typecheck

      - name: Check formatting
        run: bun run format:ts:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install all dependencies
        run: bun run install:all

      - name: Build frontend
        run: bun run build
