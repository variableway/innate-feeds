[package]
name = "innate-feeds-desktop"
version = "0.1.0"
description = "Innate Feeds desktop app"
edition = "2021"

[lib]
name = "innate_feeds_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
default = []
# this feature is used for production builds where `devUrl` is not used
custom-protocol = ["tauri/custom-protocol"]
