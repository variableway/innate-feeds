# innate.web-external-sources.v1
# 外部源登记 —— 替代 git submodule 的声明式记录。
#
# 约定：
# - 本仓不纳入外部源码；只登记「引用过哪个仓库、锚定哪个提交、用来做什么」。
# - 需要读源码时按 `repo@commit` 临时检出到任意位置（或 docs 中标注的路径），
#   读完即弃，不留在工作区。
# - submodule 已废弃：悬空 gitlink（缺 .gitmodules）在 clone/fetch 时会造成
#   幽灵删除项，且无法表达「仅调研、不构建」的语义。
protocol: innate.web-external-sources.v1
version: 1

sources:
  - id: folo
    name: Folo (RSSNext/Follow)
    repo: https://github.com/RSSNext/Folo
    commit: 379a6e6daf3f7b986c6221a4aba30f022ecc04f9
    kind: research
    checked: 2026-09-21
    notes: >-
      RSS 客户端 monorepo（pnpm + Turbo，约 36MB）。仅作调研素材：
      分析其渲染管线 / UIKit 语义色主题 / SQLite 增量同步，评估可移植性；
      以及「innate-feeds 数据输出 RSS 供 Folo 订阅」的路线。
      抓取与 RSS 解析全在闭源后端 api.follow.is，本仓借鉴的是客户端部分。
    docs:
      - docs/research/folo-analysis.md
      - docs/research/folo-deep-dive.md

  - id: newsnow
    name: NewsNow
    repo: https://github.com/newsnext/newsnow
    commit: 0560c993b226cd2fd07d8a79875d50551f52c584
    kind: research
    checked: 2026-11-01
    notes: >-
      中文热点/RSS 聚合站（Nitro，MIT，46 个源模块 / 66 个源 ID）。
      自托管形态，但可只消费其公开 API（newsnow.busiyi.world/api/s?id=…）——
      实测 11 个平台全通，且带 UA 才有 200（header 级 bot 防护）。
      源实现为纯函数 TS + cheerio/ofetch，无浏览器依赖，便于移植。
      本轮仅调研：评估「自建 collector 调其公开 API」的接入路线。
    docs:
      - docs/backlogs/newsnow-trendradar-integration.md

  - id: trendradar
    name: TrendRadar
    repo: https://github.com/sansan0/TrendRadar
    commit: 946f52aa0704883f666c322888b8cd9af4cbcfff
    kind: research
    checked: 2026-11-01
    notes: >-
      中文热点聚合 + 关键词/AI 筛选 + 多渠道推送 + SQLite 时序留存（Python，GPL-3.0）。
      关键事实：它并不直连国内平台，只调 newsnow 公开 API
      （crawler/fetcher.py:25），无 fallback；产物为 SQLite 日库 + HTML 报表，
      无可供前端消费的 JSON，也无 RSS 输出。
      GPL-3.0 红线：复制其源码进本仓会使整个 innate-feeds 被迫同许可开源。
      本轮仅调研「借鉴设计自己实现」与「仅网络交互」两条合规路线。
    docs:
      - docs/backlogs/newsnow-trendradar-integration.md

  - id: newsnext
    name: NewsNext
    repo: https://github.com/newsnext/newsnext
    commit: 8f3ffc2f2e3a7a742d9486db2e226bc2adc54a0a
    kind: research
    checked: 2026-11-01
    notes: >-
      NewsNow 的下一代形态：MV3 浏览器扩展 + 声明式 Provider（MPL-2.0，1.0.0-alpha.1）。
      CLI 闭源（npm license UNLICENSED），SDK 默认 spawn 闭源二进制
      （packages/sdk/src/transport.ts:12-13），采集发生在浏览器 Worker 内 ——
      服务端无法程序化调用其数据。
      仅 source/* 子路径为纯 Node 可用。值得借鉴的是架构模式：
      声明式 Provider、typed action 表 + 生成的 JSON Schema、Observation 增量 diff。
    docs:
      - docs/backlogs/newsnow-trendradar-integration.md

  - id: newsnext-registry
    name: NewsNext Registry
    repo: https://github.com/newsnext/registry
    commit: e02dfbc57d4a31dad7a517eb104a4e87d235e576
    kind: research
    checked: 2026-11-01
    notes: >-
      NewsNext 的声明式 Source Provider 资源仓（MPL-2.0，19 个 provider / 61 个源）。
      无 package.json、无依赖、无入口，JS provider 依赖宿主注入 context.fetch
      与 @newsnext/sdk —— 不能直接消费，需实现完整 loader 解释器。
      本轮结论：本期不纳入范围。
    docs:
      - docs/backlogs/newsnow-trendradar-integration.md
