version: "3.8"

services:
  # Option 1: SQLite-only (default, simplest)
  # Note: SQLite has no native vector operator, so semantic search on
  # SQLite uses in-Go brute force over the BLOB embedding column. This is
  # fine for < ~10k items; switch to the postgres profile for larger sets.
  hub-sqlite:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innate-hub
    restart: unless-stopped
    profiles: ["sqlite"]
    environment:
      - FUSION_PASSWORD=${HUB_PASSWORD:-secret}
      - FUSION_PORT=8080
      - FUSION_DB_PATH=/data/hub.db
      - TRENDRADAR_DATA_DIR=/data/trendradar
      - FUSION_LOG_LEVEL=${HUB_LOG_LEVEL:-INFO}
      - FUSION_PULL_INTERVAL=${HUB_PULL_INTERVAL:-1800}
      - HUB_EMBEDDER_PROVIDER=${HUB_EMBEDDER_PROVIDER:-}
      - HUB_EMBEDDER_MODEL=${HUB_EMBEDDER_MODEL:-}
      - HUB_EMBEDDER_API_KEY=${HUB_EMBEDDER_API_KEY:-}
      - HUB_EMBEDDER_BASE_URL=${HUB_EMBEDDER_BASE_URL:-}
    volumes:
      - hub_data:/data
      - ./TrendRadar/output/news:/data/trendradar:ro
    ports:
      - "${HUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Option 2: PostgreSQL (for InsForge or self-hosted Postgres)
  # Uses the pgvector image so semantic search can use native vector ops.
  hub-postgres:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innate-hub
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      - FUSION_PASSWORD=${HUB_PASSWORD:-secret}
      - FUSION_PORT=8080
      - FUSION_DB_PATH=postgres://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub}@postgres:5432/${POSTGRES_DB:-hub}?sslmode=disable
      - TRENDRADAR_DATA_DIR=/data/trendradar
      - FUSION_LOG_LEVEL=${HUB_LOG_LEVEL:-INFO}
      - FUSION_PULL_INTERVAL=${HUB_PULL_INTERVAL:-1800}
      # Embedder config (optional). When HUB_EMBEDDER_PROVIDER is set, the
      # server creates the pgvector column at HUB_EMBEDDER_DIMENSIONS.
      - HUB_EMBEDDER_PROVIDER=${HUB_EMBEDDER_PROVIDER:-}
      - HUB_EMBEDDER_MODEL=${HUB_EMBEDDER_MODEL:-}
      - HUB_EMBEDDER_API_KEY=${HUB_EMBEDDER_API_KEY:-}
      - HUB_EMBEDDER_BASE_URL=${HUB_EMBEDDER_BASE_URL:-}
      - HUB_EMBEDDER_DIMENSIONS=${HUB_EMBEDDER_DIMENSIONS:-}
    volumes:
      - ./TrendRadar/output/news:/data/trendradar:ro
    ports:
      - "${HUB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    # pgvector-enabled Postgres image. Same major version as upstream.
    image: pgvector/pgvector:pg16
    container_name: innate-hub-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hub}
      - POSTGRES_DB=${POSTGRES_DB:-hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Option 3: Full stack (innate-hub + Fusion UI as the reader).
  # Use: docker compose --profile stack up -d
  # Then open http://localhost:8081 (Fusion) which subscribes to innate-hub.
  hub-stack:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innate-hub
    restart: unless-stopped
    profiles: ["stack"]
    environment:
      - FUSION_PASSWORD=${HUB_PASSWORD:-secret}
      - FUSION_PORT=8080
      - FUSION_DB_PATH=/data/hub.db
      - TRENDRADAR_DATA_DIR=/data/trendradar
      - FUSION_LOG_LEVEL=${HUB_LOG_LEVEL:-INFO}
      - FUSION_PULL_INTERVAL=${HUB_PULL_INTERVAL:-1800}
      - FUSION_PUBLIC_URL=${FUSION_PUBLIC_URL:-http://localhost:8080}
      - HUB_EMBEDDER_PROVIDER=${HUB_EMBEDDER_PROVIDER:-}
      - HUB_EMBEDDER_MODEL=${HUB_EMBEDDER_MODEL:-}
      - HUB_EMBEDDER_API_KEY=${HUB_EMBEDDER_API_KEY:-}
      - HUB_EMBEDDER_BASE_URL=${HUB_EMBEDDER_BASE_URL:-}
    volumes:
      - hub_data:/data
      - ./TrendRadar/output/news:/data/trendradar:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  fusion:
    image: ghcr.io/0x2e/fusion:latest
    container_name: innate-hub-fusion
    restart: unless-stopped
    profiles: ["stack"]
    environment:
      - FUSION_PASSWORD=${HUB_PASSWORD:-secret}
      - FUSION_PORT=8080
      - FUSION_DB_PATH=/data/fusion.db
      - FUSION_ALLOW_EMPTY_PASSWORD=false
    volumes:
      - fusion_data:/data
    ports:
      - "${FUSION_PORT:-8081}:8080"
    depends_on:
      hub-stack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hub_data:
  postgres_data:
  fusion_data:
